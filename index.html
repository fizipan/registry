<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>fizipan/registry · shadcn/ui parts</title>
    <meta
      name="description"
      content="shadcn/ui components, themes and fonts with live previews and one-line install commands."
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#181211"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#070505"
    />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Runs before first paint so a dark reader never sees a light frame.
      try {
        var stored = localStorage.getItem("theme")
        var dark =
          stored === "dark" ||
          (stored !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
        var root = document.documentElement
        root.classList.add(dark ? "dark" : "light")
        root.style.colorScheme = dark ? "dark" : "light"
        var color = dark ? "#070505" : "#181211"
        document
          .querySelectorAll('meta[name="theme-color"]')
          .forEach(function (m) {
            m.setAttribute("content", color)
          })
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
